name: compass_software
description: "Orthopedic Supply Chain Software"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ## region architecture packages
  collection: ^1.18.0
  get_it: ^8.0.2
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.13
  logging: ^1.3.0
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  dropdown_search: ^5.0.6
  sticky_headers: ^0.3.0
  flutter_html: ^3.0.0-beta.2

  # endregion

  # region Firebase packages
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_app_installations: ^0.3.1+4
  firebase_performance: ^0.10.0+8
  # endregion

  flutter_adaptive_scaffold: ^0.3.1
  path_provider: ^2.1.5
  http: ^1.2.2
  syncfusion_flutter_pdfviewer: ^27.2.5
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # Images assets
    - assets/images/

    # flutter_dotenv
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

